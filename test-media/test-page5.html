<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>diag5</title></head><body>
<script>
const log = m => console.log(m)
const audio = new Audio()
audio.loop = true
audio.src = 'file:///E:/SoundFlow/test-media/test.wav'
// 带封面(模拟 SoundFlow 的 coverUrl → blob)
const PNG = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg=='
function dataUrlToBlob(dataUrl) {
  const comma = dataUrl.indexOf(',')
  const mime = /data:([^;]+)/.exec(dataUrl.substring(0, comma))[1]
  const bin = atob(dataUrl.substring(comma + 1))
  const bytes = new Uint8Array(bin.length)
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i)
  return new Blob([bytes], { type: mime })
}
const artUrl = URL.createObjectURL(dataUrlToBlob(PNG))
log('DIAG5-PAGE: artwork blob=' + artUrl)
navigator.mediaSession.metadata = new MediaMetadata({
  title: '测试歌曲5', artist: '测试歌手5', album: '测试专辑5',
  artwork: [{ src: artUrl, sizes: '512x512', type: 'image/png' }]
})
navigator.mediaSession.playbackState = 'playing'
navigator.mediaSession.setActionHandler('play', () => log('action play'))
navigator.mediaSession.setActionHandler('pause', () => log('action pause'))
navigator.mediaSession.setActionHandler('previoustrack', () => log('action prev'))
navigator.mediaSession.setActionHandler('nexttrack', () => log('action next'))
audio.play().then(() => log('DIAG5-PAGE: 播放中'), e => log('play err ' + e.message))
</script></body></html>
