<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- CSP:桌面歌词渲染的是网络来源文本,虽有 escapeHtml 兜底,这里再加一层纵深防御——
     不含任何远程源,即使将来出现注入也无法加载/回传远程脚本。style/script 需要
     unsafe-inline 是因为本文件自身的样式与脚本都是内联的(无外部引用)。 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' file: data:; media-src 'self' file:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none}
html,body{height:100%;overflow:hidden;background:transparent;-webkit-app-region:no-drag}
#app{position:relative;height:100%;background:rgba(0,0,0,0.05);border-radius:12px;overflow:hidden}
#lyric{height:100%;overflow-y:auto;padding:22px 12px 18px;scroll-behavior:smooth} /* 底部留够:最后一行不压在缩放柄上 */
#lyric::-webkit-scrollbar{width:3px}
#lyric::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15);border-radius:2px}
#lyric::-webkit-scrollbar-track{background:transparent}
.line{padding:3px 8px;font-size:14px;color:rgba(255,255,255,0.28);transition:all .3s ease;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;line-height:1.6;border-radius:6px;cursor:pointer;-webkit-app-region:no-drag}
.line.active{font-size:18px;font-weight:700;padding:5px 8px}
.line.near{color:rgba(255,255,255,0.55)}
.line.past{opacity:.12}
.lyric-word{transition:color .12s}
.lyric-word.cur{font-weight:700}
.lyric-trans{margin-top:2px;font-size:.82em;opacity:.72}
.empty{color:rgba(255,255,255,0.18);font-size:14px;text-align:center;padding-top:40%;-webkit-app-region:no-drag}
#ctx{display:none;position:fixed;background:rgba(20,20,40,0.96);border:1px solid rgba(255,255,255,0.12);border-radius:8px;padding:5px 0;min-width:175px;max-height:calc(100vh - 8px);overflow-y:auto;box-shadow:0 8px 28px rgba(0,0,0,0.55);z-index:999;-webkit-app-region:no-drag}
#ctx div{padding:7px 13px;margin:1px 5px;border-radius:5px;font-size:12px;color:#d5dce6;cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
#ctx div:hover{background:rgba(77,148,255,0.16);color:#4d94ff}
#ctx .sep{height:1px;background:rgba(255,255,255,0.07);margin:4px 12px;padding:0;cursor:default}
#ctx .sep:hover{background:rgba(255,255,255,0.07)}
/* 缩放柄:透明窗 + 浅色桌面时原来的白色角标基本看不见,所以给一层很淡的暗底 + 提高对比,
   并把热区从 16 收到 12(它就在最顺手的右下角,误按=以为在拖动却在改尺寸) */
#size-handle{position:absolute;bottom:0;right:0;width:12px;height:12px;cursor:nwse-resize;-webkit-app-region:no-drag;z-index:10;
  background:linear-gradient(135deg,transparent 50%,rgba(0,0,0,0.22) 100%);border-bottom-right-radius:10px}
#size-handle::after{content:'';position:absolute;bottom:2px;right:2px;width:7px;height:7px;border-right:2px solid rgba(255,255,255,0.6);border-bottom:2px solid rgba(255,255,255,0.6);border-radius:1px;filter:drop-shadow(0 0 1px rgba(0,0,0,0.8))}
#toast{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.82);color:#fff;padding:8px 18px;border-radius:8px;font-size:13px;z-index:9999;pointer-events:none;transition:opacity .3s;border:1px solid rgba(255,255,255,0.08);box-shadow:0 6px 24px rgba(0,0,0,0.45)}
.color-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
</style>
</head>
<body>
<div id="app">
  <div id="lyric"><div class="empty">🎵 暂无歌词</div></div>
  <div id="size-handle"></div>
</div>
<div id="ctx">
  <div data-a="copy">📋 复制当前歌词</div>
  <div data-a="copy-all">📄 复制全部歌词</div>
  <div class="sep"></div>
  <div data-a="bg-">透明度 -</div>
  <div data-a="bg+">透明度 +</div>
  <div class="sep"></div>
  <div data-a="lock">🔒 锁定位置(禁止移动)</div>
  <div data-a="through">👆 点击穿透(不影响桌面操作)</div>
  <div data-a="pin">📌 置顶切换</div>
  <div class="sep"></div>
  <div data-a="save">💾 保存歌词到文件</div>
  <div data-a="reset">🔄 重置窗口设置(透明度/锁定)</div>
  <div class="sep"></div>
  <div data-a="close">✕ 关闭歌词</div>
</div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s)
const api=window.electronAPI
const lyric=$('#lyric'),ctx=$('#ctx'),app=$('#app'),toast=$('#toast')
let lines=[],bgAlpha=0.05,pinned=true,locked=false,activeIdx=-1
// 逐字/翻译:由应用侧随每次推送带下来(窗口不再自己推算,也就不会有第二套算法)
let words=[],wordIdx=-1,translation='',playing=false,baseTime=0,syncAt=0,wordTimer=null
/**
 * 外观设置**来自应用侧**(歌词侧栏那套:字号/行距/对齐/特效/颜色/逐字)。
 * 此前窗口只读自己的 lyric_window_settings,于是"侧栏改了字号/颜色,桌面歌词没反应"。
 * 这里只保留两个窗口专有项:背景透明度、锁定。
 */
const appStyle={fontSize:14,gap:1.6,align:'center',effect:false,color:'#4d94ff',wordMode:false}
function loadSettings(){
  try{
    const s=JSON.parse(localStorage.getItem('lyric_window_settings')||'{}')
    if(s.bgAlpha!==undefined) bgAlpha=s.bgAlpha
    if(s.locked!==undefined) locked=s.locked
    app.style.background=`rgba(0,0,0,${bgAlpha})`
  }catch{}
}
function saveSettings(){
  try{localStorage.setItem('lyric_window_settings',JSON.stringify({bgAlpha,locked}))}catch{}
}

// ===== 歌词更新 =====
if(api){
  api.on('lyric:update',(d)=>{
    if(!d||!d.lines||!d.lines.length){lyric.innerHTML='<div class="empty">🎵 暂无歌词</div>';lines=[];return}
    lines=d.lines
    // 应用侧带下来的外观设置(带默认值兜底:老版本推送没有 style 字段)
    if(d.style) Object.assign(appStyle,d.style)
    words=Array.isArray(d.words)?d.words:[]
    wordIdx=typeof d.wordIdx==='number'?d.wordIdx:-1
    translation=d.translation||''
    playing=!!d.playing
    baseTime=Number(d.currentTime)||0
    syncAt=Date.now()
    activeIdx=typeof d.currentIdx==='number'?d.currentIdx:-1
    renderLines()
    scrollToActive()
    startWordTimer()
  })
  api.on('lyric:index',(idx)=>{activeIdx=idx;renderLines();scrollToActive()})
}
function escapeHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
}
/** 当前行内容:逐字模式且有词片 → 逐字;否则整行文本。翻译挂在当前行下面 */
function lineInner(l,i){
  let html
  if(i===activeIdx&&appStyle.wordMode&&words.length){
    // 三档与播放页 LyricLine 一致:已唱 80% / 当前全色 / 未唱 40%
    html=words.map((w,wi)=>`<span class="lyric-word${wi===wordIdx?' cur':''}"${wi!==wordIdx?` style="color:${appStyle.color}${wi<wordIdx?'cc':'66'}"`:''}>${escapeHtml(w.c)}</span>`).join('')
  }else{
    html=escapeHtml(l.text||l)
  }
  if(i===activeIdx&&translation) html+=`<div class="lyric-trans">${escapeHtml(translation)}</div>`
  return html
}
function renderLines(){
  lyric.innerHTML=lines.map((l,i)=>{
    const cls=i===activeIdx?'line active':(i>activeIdx&&i-activeIdx<=2?'line near':(i<activeIdx?'line past':'line'))
    return `<div class="${cls}" data-i="${i}">${lineInner(l,i)}</div>`
  }).join('')
  applyStyle()
}
function scrollToActive(){
  const active=lyric.querySelector('.line.active')
  if(!active) return
  const ch=lyric.clientHeight,ot=active.offsetTop,oh=active.offsetHeight
  lyric.scrollTo({top:ot-ch/2+oh/2,behavior:'smooth'})
}
/**
 * 逐字要随时间推进,而推送只在切行/状态变化时来 —— 这里用"快照时间 + 已过时长"插值,
 * 每 120ms 只改 .cur 类(不重建 DOM)。
 */
function startWordTimer(){
  if(wordTimer){clearInterval(wordTimer);wordTimer=null}
  if(!appStyle.wordMode) return
  wordTimer=setInterval(()=>{
    if(!playing||!words.length) return
    const t=baseTime+(Date.now()-syncAt)/1000
    let idx=-1
    for(let i=0;i<words.length;i++){ if(words[i].t<=t) idx=i; else break }
    if(idx===wordIdx) return
    wordIdx=idx
    const spans=lyric.querySelectorAll('.line.active .lyric-word')
    spans.forEach((el,i)=>{
      el.classList.toggle('cur',i===wordIdx)
      // 同样三档(与 LyricLine 那份保持一致)
      el.style.color=i===wordIdx?'':(appStyle.color+(i<wordIdx?'cc':'66'))
    })
  },120)
}
function applyStyle(){
  lyric.style.textAlign=appStyle.align==='left'?'left':'center'
  lyric.querySelectorAll('.line').forEach((el,i)=>{
    const active=i===activeIdx
    el.style.fontSize=(active?appStyle.fontSize+4:appStyle.fontSize)+'px'
    el.style.lineHeight=String(appStyle.gap)
    el.style.fontWeight=active?700:400
    el.style.color=active?appStyle.color:(i>activeIdx&&i-activeIdx<=2?'rgba(255,255,255,0.55)':'rgba(255,255,255,0.28)')
    el.style.textShadow=active?`0 0 20px ${hexToRgba(appStyle.color,0.4)}`:'none'
  })
}
function hexToRgba(hex,alpha){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16)
  return `rgba(${r},${g},${b},${alpha})`
}


// ===== 主菜单 =====
document.addEventListener('contextmenu',e=>{
  e.preventDefault()
  ctx.style.display='block'
  const cw=ctx.offsetWidth,ch=ctx.offsetHeight,winW=window.innerWidth,winH=window.innerHeight
  let x=e.clientX,y=e.clientY
  if(y+ch>winH) y=Math.max(2,y-ch-4)
  if(x+cw>winW) x=winW-cw-4
  if(x<2) x=2; if(y<2) y=2
  ctx.style.left=x+'px'; ctx.style.top=y+'px'
})
document.addEventListener('click',e=>{
  if(!ctx.contains(e.target)) ctx.style.display='none'
})
function showToast(msg,dur=1500){
  toast.textContent=msg;toast.style.display='block';toast.style.opacity='1'
  setTimeout(()=>{toast.style.opacity='0';setTimeout(()=>{toast.style.display='none'},300)},dur)
}

ctx.addEventListener('click',e=>{
  const a=e.target.dataset.a; if(!a) return
  ctx.style.display='none'
  handleAction(a)
})

function handleAction(a){
  if(!api) return
  if(a==='close') api.lyricClose()
  else if(a==='bg+'){bgAlpha=Math.min(0.9,+(bgAlpha+0.1).toFixed(1));app.style.background=`rgba(0,0,0,${bgAlpha})`;saveSettings();showToast('背景: '+Math.round(bgAlpha*100)+'%')}
  else if(a==='bg-'){bgAlpha=Math.max(0.05,+(bgAlpha-0.1).toFixed(1));app.style.background=`rgba(0,0,0,${bgAlpha})`;saveSettings();showToast('背景: '+Math.round(bgAlpha*100)+'%')}
  else if(a==='through'){
    api.lyricClickThrough(true)
    showToast('已开启点击穿透(点播放栏歌词按钮关闭后重开恢复)')
  }
  else if(a==='pin'){
    pinned=!pinned;api.lyricPin(pinned);showToast(pinned?'已置顶':'已取消置顶')
  }
  else if(a==='lock'){
    locked=!locked
    api.lyricLock(locked)
    showToast(locked?'已锁定位置(不可移动,右键可解锁)':'已解锁(可自由移动)');saveSettings()
  }
  else if(a==='copy'){
    const active=lyric.querySelector('.line.active')
    if(active){navigator.clipboard.writeText(active.textContent);showToast('已复制当前歌词')}
    else{showToast('暂无活跃歌词')}
  }
  else if(a==='copy-all'){
    const allText=lines.map(l=>l.text||l).join('\n')
    if(allText){navigator.clipboard.writeText(allText);showToast('已复制全部歌词 ('+lines.length+'行)')}
    else{showToast('暂无歌词')}
  }
  else if(a==='save'){
    if(lines.length===0){showToast('暂无歌词可保存');return}
    const allText=lines.map(l=>{
      const t=l.time!=null?`[${Math.floor(l.time/60).toString().padStart(2,'0')}:${(l.time%60).toFixed(2).padStart(5,'0')}]`:''
      return t+(l.text||l)
    }).join('\n')
    api.lyricSave(allText)
    showToast('正在保存歌词文件...')
  }
  else if(a==='reset'){
    // 只重置窗口专有项;字号/颜色/逐字/翻译由应用侧栏统一管理,不在这里动
    bgAlpha=0.05;locked=false
    app.style.background=`rgba(0,0,0,${bgAlpha})`
    saveSettings()
    showToast('窗口设置已重置(透明度/锁定)')
  }
}

// ===== 窗口拖动 + 缩放(JS 实现:任意位置按住即拖,>4px 判定为拖动) =====
// 坐标一律用**指针的绝对屏幕坐标**(screenX/screenY),由主进程按"按下时的锚点"换算位置。
// 不能用 movementX/Y:那是 Chromium 按指针屏幕坐标相对上一次事件算的,而拖动时窗口正在光标
// 下面移动 —— 两者互相污染,上报的位移与指针真实走过的距离对不上(越拖越跟不上)。
let dragState = null
let sizeState = null
let suppressClick = false
let _dragRaf = null
let _pendingPointer = null

document.addEventListener('mousedown', e => {
  if (locked) return
  if (e.button !== 0) return
  // 只在精确落在缩放柄热区时才进入缩放模式,其余一律视为拖动
  if (e.target.closest?.('#size-handle')) {
    dragState = null // 拖动/缩放互斥:否则拖动的"锁定尺寸"会把缩放结果盖掉
    sizeState = { sx: e.screenX, sy: e.screenY, w: window.innerWidth, h: window.innerHeight }
    return
  }
  sizeState = null
  dragState = { sx: e.screenX, sy: e.screenY, moved: false }
  // 记锚点:主进程据此把"指针位移"映射成"窗口位置",不再读窗口当前位置(没有反馈)
  if (api && api.lyricDragStart) api.lyricDragStart(e.screenX, e.screenY)
})
document.addEventListener('mousemove', e => {
  // 鼠标在**窗口之外**松开时,这里收不到 mouseup —— 状态会一直留着,光标再回到窗口上就继续
  // 拖/继续缩。用户报的"只是移动,歌词区域却同步变大"就是这个:上一次拖角落留下的 sizeState
  // 没被清掉,于是之后每次移动都在按指针坐标改尺寸。用 buttons 判断"按键其实已经松了"。
  if ((e.buttons & 1) === 0) {
    if (dragState || sizeState) {
      if (_pendingPointer && api && api.lyricDragMove) api.lyricDragMove(_pendingPointer.x, _pendingPointer.y)
      dragState = null
      sizeState = null
      _pendingPointer = null
      if (_dragRaf) { cancelAnimationFrame(_dragRaf); _dragRaf = null }
    }
    return
  }
  if (dragState) {
    const dx = e.screenX - dragState.sx, dy = e.screenY - dragState.sy
    if (!dragState.moved && (Math.abs(dx) > 4 || Math.abs(dy) > 4)) {
      dragState.moved = true
      suppressClick = true
    }
    if (dragState.moved && api && api.lyricDragMove) {
      // 合并到每帧一次(mousemove 可达上百赫兹,不必逐条过 IPC);上报绝对坐标
      _pendingPointer = { x: e.screenX, y: e.screenY }
      if (!_dragRaf) {
        _dragRaf = requestAnimationFrame(() => {
          _dragRaf = null
          const p = _pendingPointer
          _pendingPointer = null
          if (p && api && api.lyricDragMove) api.lyricDragMove(p.x, p.y)
        })
      }
    }
  }
  if (sizeState) {
    // 尺寸同样按指针绝对位移算。旧写法把"起始尺寸 + 单帧 movementX"当绝对尺寸用,
    // 每次事件都把尺寸拉回起始值附近 —— 所以缩放几乎不跟手
    if (api && api.lyricResize) {
      api.lyricResize(
        Math.max(220, sizeState.w + (e.screenX - sizeState.sx)),
        Math.max(60, sizeState.h + (e.screenY - sizeState.sy))
      )
    }
  }
})
document.addEventListener('mouseup', () => {
  // 把攒着的那一帧**立刻补发**再清空:快速拖拽时鼠标一松,最后一帧还没发出去就被取消,
  // 位置会停在上一帧(拖到哪儿差一点没跟上)
  if (_pendingPointer && api && api.lyricDragMove) api.lyricDragMove(_pendingPointer.x, _pendingPointer.y)
  if (_dragRaf) { cancelAnimationFrame(_dragRaf); _dragRaf = null }
  _pendingPointer = null
  dragState = null
  sizeState = null
})
// 失焦(切走/窗被隐藏)时也清掉,避免回来还处在拖动/缩放中
window.addEventListener('blur', () => {
  dragState = null
  sizeState = null
  _pendingPointer = null
  if (_dragRaf) { cancelAnimationFrame(_dragRaf); _dragRaf = null }
})

// 拖动/缩放后消费一次 click,避免误触歌词/菜单
document.addEventListener('click', e => {
  if (suppressClick) { e.stopPropagation(); suppressClick = false }
}, true)

// 右下角缩放柄不需要单独监听:上面的 mousedown 已按 closest('#size-handle') 分派到缩放

// ===== 双击歌词行跳转 =====
lyric.addEventListener('dblclick', e => {
  if (suppressClick) { suppressClick = false; return }
  const el=e.target.closest?.('.line')
  if(!el) return
  const idx=parseInt(el.dataset.i)
  if(!isNaN(idx)&&lines[idx]&&lines[idx].time!=null){
    api.lyricSeek(lines[idx].time)
  }
})

// ===== ESC 关闭 =====
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&api) api.lyricClose()})

// ===== 加载设置 =====
loadSettings()
</script>
</body>
</html>
