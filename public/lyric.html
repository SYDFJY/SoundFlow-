<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- CSP:桌面歌词渲染的是网络来源文本,虽有 escapeHtml 兜底,这里再加一层纵深防御——
     不含任何远程源,即使将来出现注入也无法加载/回传远程脚本。style/script 需要
     unsafe-inline 是因为本文件自身的样式与脚本都是内联的(无外部引用)。 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' file: data:; media-src 'self' file:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none}
html,body{height:100%;overflow:hidden;background:transparent;-webkit-app-region:no-drag}
#app{position:relative;height:100%;background:rgba(0,0,0,0.05);border-radius:12px;overflow:hidden}
#title-bar{position:absolute;top:0;left:0;right:0;height:24px;line-height:24px;padding:0 12px;font-size:12px;color:rgba(255,255,255,0.55);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 4px rgba(0,0,0,0.9);pointer-events:none;z-index:5}
#lyric{height:100%;overflow-y:auto;overflow-x:hidden;padding:22px 12px 18px;scroll-behavior:smooth} /* 底部留够:最后一行不压在缩放柄上 */
#lyric.has-title{padding-top:34px}
#lyric::-webkit-scrollbar{width:3px}
#lyric::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15);border-radius:2px}
#lyric::-webkit-scrollbar-track{background:transparent}
.line{padding:3px 8px;font-size:14px;color:rgba(255,255,255,0.28);transition:color .25s ease,font-size .25s ease;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.6;border-radius:6px;cursor:pointer;-webkit-app-region:no-drag}
.line.active{font-size:18px;font-weight:700;padding:5px 8px}
.line.near{color:rgba(255,255,255,0.55)}
.line.past{opacity:.12}
.lyric-word{transition:color .18s ease,text-shadow .18s ease;text-shadow:0 0 2px rgba(0,0,0,.95),0 2px 6px rgba(0,0,0,.65)}
.lyric-word.cur{font-weight:700;text-shadow:0 0 2px rgba(0,0,0,.95),0 2px 6px rgba(0,0,0,.65),0 0 18px currentColor}
.lyric-trans{margin-top:2px;font-size:.82em;opacity:.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{color:rgba(255,255,255,0.18);font-size:14px;text-align:center;padding-top:40%;-webkit-app-region:no-drag}

/* ===== 右键菜单:与应用内菜单同刻度的卡片(窗口不走 Vite,数值内联) ===== */
#ctx{display:none;position:fixed;min-width:min(236px,100vw - 8px);max-height:calc(100vh - 10px);overflow-y:auto;padding:5px;border-radius:10px;
  background:rgba(24,26,32,0.97);border:1px solid rgba(255,255,255,0.10);box-shadow:0 14px 38px rgba(0,0,0,0.55),0 2px 8px rgba(0,0,0,0.4);
  z-index:999;-webkit-app-region:no-drag}
#ctx.open{display:block;animation:ctx-in .12s ease-out}
@keyframes ctx-in{from{opacity:0;transform:translateY(-4px) scale(.97)}to{opacity:1;transform:none}}
#ctx.closing{display:block;animation:ctx-out .09s ease-in forwards}
@keyframes ctx-out{to{opacity:0;transform:translateY(-3px) scale(.98)}}
#ctx::-webkit-scrollbar{width:4px}
#ctx::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.16);border-radius:2px}
.ctx-group{font-size:11px;color:rgba(255,255,255,0.38);padding:7px 10px 3px;letter-spacing:.02em}
/* 「与播放界面一致」模式:行间距/过渡/hover 对齐播放界面;已唱过的行不再额外淡化
   (播放界面只按 |行号-当前行| 分档,没有"已唱过"这一档) */
#lyric.app-mode .line{padding:10px 0;transition:all .4s ease}
#lyric.app-mode .line.past{opacity:1}
#lyric.app-mode .line:hover{background:rgba(255,255,255,0.06)}
#lyric.app-mode .line.active{background:transparent}
.ctx-swatches{display:flex;align-items:center;gap:7px;padding:5px 10px 8px;flex-wrap:wrap}
.ctx-swatch{width:18px;height:18px;border-radius:50%;background:var(--c,#888);cursor:pointer;position:relative;border:1px solid rgba(255,255,255,0.22);box-sizing:border-box}
.ctx-swatch:hover{transform:scale(1.12)}
.ctx-swatch.on{box-shadow:0 0 0 2px rgba(24,26,32,0.97),0 0 0 3.5px var(--c,#fff)}
.ctx-swatch.custom{overflow:hidden;background:conic-gradient(#ff5f6d,#ffc371,#7ee787,#6ec6ff,#c792ea,#ff5f6d)}
.ctx-swatch.custom input{opacity:0;width:100%;height:100%;cursor:pointer;border:0;padding:0}
.ctx-swatch.auto{background:rgba(255,255,255,0.1);color:#dfe5ee;font-size:11px;line-height:16px;text-align:center;border-style:dashed}
.ctx-swatch.auto.on{background:rgba(77,148,255,0.25);color:#fff}
.ctx-item{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:7px;font-size:13px;color:#dfe5ee;cursor:pointer;position:relative;white-space:nowrap}
.ctx-item:hover,.ctx-item.kbd{background:rgba(255,255,255,0.09);color:#fff}
.ctx-item:hover::before,.ctx-item.kbd::before{content:'';position:absolute;left:2px;top:50%;transform:translateY(-50%);width:2px;height:14px;border-radius:1px;background:var(--accent,#4d94ff)}
.ctx-item svg{width:15px;height:15px;flex:0 0 15px;opacity:.85}
.ctx-item .ctx-label{flex:1}
.ctx-item .ctx-value{font-size:11px;color:rgba(255,255,255,0.42)}
.ctx-item .ctx-check{width:15px;height:15px;flex:0 0 15px;opacity:0;color:var(--accent,#4d94ff)}
.ctx-item.on .ctx-check{opacity:1}
.ctx-item.on{color:#fff}
.ctx-item.danger{color:#ff7b72}
.ctx-item.danger:hover{background:rgba(255,123,114,0.14);color:#ff9b93}
.ctx-item.danger:hover::before{background:#ff7b72}
.ctx-sep{height:1px;background:rgba(255,255,255,0.08);margin:4px 8px}
.ctx-sub{font-size:11px;color:rgba(255,255,255,0.3);padding:8px 10px 0}

/* 缩放柄:透明窗 + 浅色桌面时原来的白色角标基本看不见,所以给一层很淡的暗底 + 提高对比,
   并把热区从 16 收到 12(它就在最顺手的右下角,误按=以为在拖动却在改尺寸) */
#size-handle{position:absolute;bottom:0;right:0;width:12px;height:12px;cursor:nwse-resize;-webkit-app-region:no-drag;z-index:10;
  background:linear-gradient(135deg,transparent 50%,rgba(0,0,0,0.22) 100%);border-bottom-right-radius:10px}
#size-handle::after{content:'';position:absolute;bottom:2px;right:2px;width:7px;height:7px;border-right:2px solid rgba(255,255,255,0.6);border-bottom:2px solid rgba(255,255,255,0.6);border-radius:1px;filter:drop-shadow(0 0 1px rgba(0,0,0,0.8))}
#toast{display:none;position:fixed;top:14px;left:50%;transform:translateX(-50%);background:rgba(20,22,28,0.94);color:#fff;padding:7px 16px;border-radius:9px;font-size:12.5px;z-index:9999;pointer-events:none;opacity:0;transition:opacity .22s ease;border:1px solid rgba(255,255,255,0.1);box-shadow:0 8px 24px rgba(0,0,0,0.45);max-width:92%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1}
</style>
</head>
<body>
<div id="app">
  <div id="title-bar"></div>
  <div id="lyric"><div class="empty">暂无歌词</div></div>
  <div id="size-handle"></div>
</div>
<div id="ctx" role="menu" aria-label="桌面歌词菜单">
  <div class="ctx-group">显示</div>
  <div class="ctx-item" data-a="wordMode" role="menuitemcheckbox">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7V4h16v3"/><path d="M9 20h6"/><path d="M12 4v16"/></svg>
    <span class="ctx-label">逐字高亮</span><svg class="ctx-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
  </div>
  <div class="ctx-item" data-a="translation" role="menuitemcheckbox">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/></svg>
    <span class="ctx-label">显示翻译</span><svg class="ctx-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
  </div>
  <div class="ctx-item" data-a="effect" role="menuitemcheckbox">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.9 5.8L4 10.7l5.8 1.9L12 18.4l1.9-5.8L20 10.7l-5.8-1.9z"/><path d="M5 3v4"/><path d="M3 5h4"/></svg>
    <span class="ctx-label">歌词特效</span><svg class="ctx-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
  </div>
  <div class="ctx-item" data-a="title" role="menuitemcheckbox">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
    <span class="ctx-label">显示歌名</span><svg class="ctx-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
  </div>
  <div class="ctx-item" data-a="style-dim" role="menuitemradio">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M7 12h10"/><path d="M10 18h4"/></svg>
    <span class="ctx-label">淡色(当前行高亮)</span><svg class="ctx-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
  </div>
  <div class="ctx-item" data-a="style-app" role="menuitemradio">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
    <span class="ctx-label">与播放界面一致</span><svg class="ctx-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
  </div>
  <div class="ctx-item" data-a="font-">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/><path d="M8 11h6"/></svg>
    <span class="ctx-label">字号</span><span class="ctx-value" data-v="font"></span>
  </div>
  <div class="ctx-item" data-a="font+">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/><path d="M8 11h6"/><path d="M11 8v6"/></svg>
    <span class="ctx-label">字号(加大)</span><span class="ctx-value" data-v="font"></span>
  </div>
  <div class="ctx-item" data-a="align">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 6H3"/><path d="M15 12H3"/><path d="M17 18H3"/></svg>
    <span class="ctx-label">左对齐</span><svg class="ctx-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
  </div>
  <div class="ctx-sep"></div>
  <div class="ctx-group">歌词颜色</div>
  <div class="ctx-swatches">
    <span class="ctx-swatch" data-color="#6ec6ff" style="--c:#6ec6ff" title="#6ec6ff"></span>
    <span class="ctx-swatch" data-color="#7ee787" style="--c:#7ee787" title="#7ee787"></span>
    <span class="ctx-swatch" data-color="#ffd700" style="--c:#ffd700" title="#ffd700"></span>
    <span class="ctx-swatch" data-color="#ff7eb6" style="--c:#ff7eb6" title="#ff7eb6"></span>
    <span class="ctx-swatch" data-color="#c792ea" style="--c:#c792ea" title="#c792ea"></span>
    <span class="ctx-swatch" data-color="#ffffff" style="--c:#ffffff" title="#ffffff"></span>
    <label class="ctx-swatch custom" title="自定义颜色(系统取色器)">
      <input type="color" id="ctx-color-input">
    </label>
    <span class="ctx-swatch auto" data-a="color-auto" title="跟随应用侧歌词颜色">A</span>
  </div>
  <div class="ctx-sep"></div>
  <div class="ctx-group">背景</div>
  <div class="ctx-item" data-a="bg-dark" role="menuitemradio">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
    <span class="ctx-label">深色底</span><svg class="ctx-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
  </div>
  <div class="ctx-item" data-a="bg-light" role="menuitemradio">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.9 4.9 1.4 1.4"/><path d="m17.7 17.7 1.4 1.4"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.3 17.7-1.4 1.4"/><path d="m19.1 4.9-1.4 1.4"/></svg>
    <span class="ctx-label">浅色底</span><svg class="ctx-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
  </div>
  <div class="ctx-item" data-a="bg-none" role="menuitemradio">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="m9 9 6 6"/><path d="m15 9-6 6"/></svg>
    <span class="ctx-label">完全透明</span><svg class="ctx-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
  </div>
  <div class="ctx-item" data-a="alpha-">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/></svg>
    <span class="ctx-label">降低不透明度</span><span class="ctx-value" data-v="alpha"></span>
  </div>
  <div class="ctx-item" data-a="alpha+">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/><path d="M12 8v8"/></svg>
    <span class="ctx-label">提高不透明度</span><span class="ctx-value" data-v="alpha"></span>
  </div>
  <div class="ctx-sep"></div>
  <div class="ctx-group">窗口</div>
  <div class="ctx-item" data-a="locked" role="menuitemcheckbox">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    <span class="ctx-label">锁定位置</span><svg class="ctx-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
  </div>
  <div class="ctx-item" data-a="pinned" role="menuitemcheckbox">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 10.8V4h6v6.8l2 2.6v1.6H7v-1.6z"/></svg>
    <span class="ctx-label">窗口置顶</span><svg class="ctx-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
  </div>
  <div class="ctx-item" data-a="through">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 3 7.07 16.97 2.51-7.39 7.39-2.51z"/></svg>
    <span class="ctx-label">点击穿透</span>
  </div>
  <div class="ctx-sep"></div>
  <div class="ctx-group">文件</div>
  <div class="ctx-item" data-a="copy">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
    <span class="ctx-label">复制当前歌词</span>
  </div>
  <div class="ctx-item" data-a="copy-all">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H9a1 1 0 0 0-1 1v2a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V3a1 1 0 0 0-1-1Z"/><path d="M8 4H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2"/><path d="M9 12h6"/><path d="M9 16h6"/></svg>
    <span class="ctx-label">复制全部歌词</span>
  </div>
  <div class="ctx-item" data-a="save">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v5h5"/><path d="M12 12v6"/><path d="m9 15 3 3 3-3"/></svg>
    <span class="ctx-label">保存歌词到文件</span>
  </div>
  <div class="ctx-sep"></div>
  <div class="ctx-item danger" data-a="reset">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
    <span class="ctx-label">重置窗口设置</span>
  </div>
  <div class="ctx-item danger" data-a="close">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    <span class="ctx-label">关闭桌面歌词</span><span class="ctx-value">Esc</span>
  </div>
</div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s)
const api=window.electronAPI
const lyric=$('#lyric'),ctx=$('#ctx'),app=$('#app'),toast=$('#toast'),titleBar=$('#title-bar')
let lines=[],activeIdx=-1,playing=false
let words=[],wordIdx=-1,translation='',baseTime=0,syncAt=0,wordTimer=null
// 窗口专有设置:真源在**应用侧**(随载荷 win 字段下来),窗口只消费 ——
// 此前窗口自己存一份 localStorage,于是勾选态、重启后的置顶都跟应用侧对不上
let win={bg:'dark',alpha:0.05,locked:false,pinned:true,showTitle:true}
let songTitle='',songArtist=''
/**
 * 外观设置**来自应用侧**(歌词侧栏那套:字号/行距/对齐/特效/颜色/逐字)。
 * 此前窗口只读自己的 lyric_window_settings,于是"侧栏改了字号/颜色,桌面歌词没反应"。
 */
const appStyle={fontSize:18,gap:1.6,align:'center',effect:false,color:'#4d94ff',wordMode:false}
/** 当前生效的歌词颜色:桌面窗自己的色(win.color)优先,'auto' 才跟随应用侧 ——
 *  用户要求"在桌面歌词改颜色不能连带改掉播放界面",所以这里绝不回写应用侧设置 */
function lyricColor(){
  const c = win.color && win.color !== 'auto' ? String(win.color) : ''
  return c || appStyle.color
}

function applyBackground(){
  const rgb = win.bg==='light' ? '255,255,255' : '0,0,0'
  const a = win.bg==='none' ? 0 : Number(win.alpha)||0
  app.style.background = `rgba(${rgb},${a})`
  // 浅色底上白字看不见:整窗切到深色文字(描边也跟着换)
  document.body.classList.toggle('on-light', win.bg==='light' && a>0.35)
}
function applyTitleBar(){
  const on = !!win.showTitle && !!(songTitle || songArtist)
  titleBar.textContent = on ? (songArtist ? `${songTitle} · ${songArtist}` : songTitle) : ''
  titleBar.style.display = on ? '' : 'none'
  lyric.classList.toggle('has-title', on)
}
function syncMenuChecks(){
  const on = (a, v) => { const el=ctx.querySelector(`[data-a="${a}"]`); if(el) el.classList.toggle('on', !!v) }
  on('wordMode', appStyle.wordMode)
  on('translation', translation !== '' || !!lastTranslationOn)
  on('effect', appStyle.effect)
  on('title', win.showTitle)
  on('align', appStyle.align === 'left')
  on('locked', win.locked)
  on('pinned', win.pinned)
  on('style-dim', win.lineStyle !== 'app')
  on('style-app', win.lineStyle === 'app')
  on('bg-dark', win.bg === 'dark')
  on('bg-light', win.bg === 'light')
  on('bg-none', win.bg === 'none')
  const cur=lyricColor().toLowerCase()
  const autoOn=!(win.color && win.color!=='auto')
  ctx.querySelectorAll('.ctx-swatch[data-color]').forEach((el)=>{
    el.classList.toggle('on', !autoOn && el.dataset.color.toLowerCase()===cur)
  })
  const autoEl=ctx.querySelector('[data-a="color-auto"]')
  if(autoEl) autoEl.classList.toggle('on', autoOn)
  const customEl=ctx.querySelector('.ctx-swatch.custom')
  if(customEl){
    const isPreset=[...ctx.querySelectorAll('.ctx-swatch[data-color]')].some((el)=>el.dataset.color.toLowerCase()===cur)
    customEl.classList.toggle('on', !autoOn && !isPreset)
  }
  const fv=ctx.querySelector('[data-v="font"]'); if(fv) fv.textContent = appStyle.fontSize + 'px'
  const av=ctx.querySelector('[data-v="alpha"]'); if(av) av.textContent = win.bg==='none' ? '—' : Math.round((Number(win.alpha)||0)*100) + '%'
}
// 翻译开关:窗口不知道应用侧的 showTranslation 状态,用"有没有译文可显示"近似表示
let lastTranslationOn=false

// ===== 歌词更新 =====
if(api){
  api.on('lyric:update',(d)=>{
    if(!d||!d.lines||!d.lines.length){lyric.innerHTML='<div class="empty">暂无歌词</div>';lines=[];applyTitleBar();return}
    lines=d.lines
    if(d.style) Object.assign(appStyle,d.style)
    if(d.win) Object.assign(win,d.win)
    songTitle=String(d.title||'');songArtist=String(d.artist||'')
    lastTranslationOn=!!(d.translation||lines.some(l=>l&&l.trans))
    words=Array.isArray(d.words)?d.words:[]
    wordIdx=typeof d.wordIdx==='number'?d.wordIdx:-1
    translation=d.translation||''
    playing=!!d.playing
    baseTime=Number(d.currentTime)||0
    syncAt=Date.now()
    activeIdx=typeof d.currentIdx==='number'?d.currentIdx:-1
    applyBackground();applyTitleBar()
    renderLines()
    scrollToActive()
    startWordTimer()
  })
  api.on('lyric:index',(idx)=>{activeIdx=idx;renderLines();scrollToActive()})
  // 保存结果:此前主进程发了这个事件,窗口没订阅 —— 永远停在"正在保存…"
  api.on('lyric:save-done',(ok)=>{ showToast(ok===false?'保存失败':'已保存歌词文件') })
  // 穿透被解除(托盘"恢复歌词交互")时要让窗口自己知道,否则状态与界面长期不符
  api.on('lyric:through',()=>{ showToast('已恢复歌词交互') })
}
function escapeHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
}
/** 当前行内容:逐字模式且有词片 → 逐字;否则整行文本。翻译挂在当前行下面 */
function lineInner(l,i){
  let html
  if(i===activeIdx&&appStyle.wordMode&&words.length){
    // 三档与播放页 LyricLine 一致:已唱 80% / 当前全色 / 未唱 40%
    html=words.map((w,wi)=>`<span class="lyric-word${wi===wordIdx?' cur':''}"${wi!==wordIdx?` style="color:${lyricColor()}${wi<wordIdx?'cc':'99'}"`:''}>${escapeHtml(w.c)}</span>`).join('')
  }else{
    html=escapeHtml(l.text||l)
  }
  // 译文**按行取**(l.trans 随载荷里的行一起来,与行号天然对齐);只有老格式载荷没有它时
  // 才退回全局 translation —— 那个值与索引是两条推送,谁快谁慢都会让译文错行
  const ownTrans=(l&&typeof l==='object'&&l.trans)||translation
  if(i===activeIdx&&ownTrans) html+=`<div class="lyric-trans">${escapeHtml(ownTrans)}</div>`
  return html
}
function renderLines(){
  const appMode=win.lineStyle==='app'
  lyric.innerHTML=lines.map((l,i)=>{
    let cls
    if(appMode){
      // 与播放界面一致:按 |行号-当前行| 分档,±1 行算 near;**没有"已唱过"这一档**
      const d=Math.abs(i-activeIdx)
      cls=i===activeIdx?'line active':(d===1?'line near':(d>1?'line far':'line'))
    }else{
      cls=i===activeIdx?'line active':(i>activeIdx&&i-activeIdx<=2?'line near':(i<activeIdx?'line past':'line'))
    }
    return `<div class="${cls}" data-i="${i}">${lineInner(l,i)}</div>`
  }).join('')
  applyStyle()
}
function scrollToActive(){
  const active=lyric.querySelector('.line.active')
  if(!active) return
  const ch=lyric.clientHeight,ot=active.offsetTop,oh=active.offsetHeight
  lyric.scrollTo({top:ot-ch/2+oh/2,behavior:'smooth'})
}
/**
 * 逐字要随时间推进,而推送只在切行/状态变化时来 —— 这里用"快照时间 + 已过时长"插值,
 * 每 120ms 只改 .cur 类(不重建 DOM)。
 */
function startWordTimer(){
  if(wordTimer){clearInterval(wordTimer);wordTimer=null}
  if(!appStyle.wordMode) return
  wordTimer=setInterval(()=>{
    if(!playing||!words.length) return
    const t=baseTime+(Date.now()-syncAt)/1000
    let idx=-1
    for(let i=0;i<words.length;i++){ if(words[i].t<=t) idx=i; else break }
    if(idx===wordIdx) return
    wordIdx=idx
    const spans=lyric.querySelectorAll('.line.active .lyric-word')
    spans.forEach((el,i)=>{
      el.classList.toggle('cur',i===wordIdx)
      // 同样三档(与 LyricLine 那份保持一致)
      el.style.color=i===wordIdx?'':(lyricColor()+(i<wordIdx?'cc':'99'))
    })
  },120)
}
/** 当前行胶囊:与 src/utils/lyricStyle.js 的 lyricActivePill 同一算式(窗口用不了 ESM) */
function lyricActivePill(hex){
  return {
    background:`linear-gradient(90deg, transparent, ${hexToRgba(hex,0.16)}, transparent)`,
    boxShadow:`inset 0 0 0 1px ${hexToRgba(hex,0.18)}`
  }
}
function hexToRgba(hex,alpha){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16)
  return `rgba(${r},${g},${b},${alpha})`
}
/**
 * 样式:**行上不再写 text-align**(此前 .line 自带 text-align:center,把容器上的
 * style.textAlign=left 压掉了 —— 应用侧推来的"左对齐"在窗口里根本不生效)。
 * 对齐交给 #lyric 的 text-align 让行继承。
 */
function applyStyle(){
  lyric.style.textAlign=appStyle.align==='left'?'left':'center'
  const light=document.body.classList.contains('on-light')
  const dim=(a)=>light?`rgba(20,22,28,${a})`:`rgba(255,255,255,${a})`
  const appMode=win.lineStyle==='app'
  lyric.classList.toggle('app-mode',appMode)
  lyric.querySelectorAll('.line').forEach((el,i)=>{
    const active=i===activeIdx
    // 相邻行:播放界面是 ±1 行(只有特效开着才算),淡色模式是后面 1~2 行
    const near=appMode
      ? (appStyle.effect&&Math.abs(i-activeIdx)===1)
      : (i>activeIdx&&i-activeIdx<=2)
    el.style.fontSize=(active?appStyle.fontSize+4:(near?appStyle.fontSize+1.5:appStyle.fontSize))+'px'
    el.style.lineHeight=String(appStyle.gap)
    el.style.fontWeight=active?700:400
    if(appMode){
      // 与播放界面一致:颜色/阴影**用应用侧算好下发的那份**(规则只有一份,见 lyricStyle.js),
      // 这里不做任何推导 —— 下发缺失(老载荷)才退回淡色那套,避免整块变黑
      const l=lines[i]
      const accent=lyricColor()
      el.style.color=(l&&l.color)?l.color:accent
      el.style.textShadow=(l&&l.shadow)?l.shadow:'none'
      const pill=(active&&appStyle.effect)?lyricActivePill(accent):null
      el.style.background=pill?pill.background:''
      el.style.boxShadow=pill?pill.boxShadow:''
    }else{
      // 淡色模式(默认):中性色分档 + 已唱过更淡;对比度按桌面场景调过
      // (壁纸什么颜色不知道,没唱到的行太淡就看不清 —— 原来 0.34/0.62、特效关 0.5)
      const accent=lyricColor()
      el.style.color=active?accent:(appStyle.effect?(near?dim(0.82):dim(0.62)):dim(0.72))
      el.style.textShadow=active?(appStyle.effect?`0 0 20px ${hexToRgba(accent,0.4)}`:'none'):'none'
      el.style.background=''
      el.style.boxShadow=''
    }
  })
}

// ===== 右键菜单 =====
let menuOpen=false
function openMenu(x,y){
  syncMenuChecks()
  ctx.classList.remove('closing')
  ctx.classList.add('open')
  menuOpen=true
  const cw=ctx.offsetWidth,ch=ctx.offsetHeight,winW=window.innerWidth,winH=window.innerHeight
  if(y+ch>winH) y=Math.max(2,y-ch-2)
  if(x+cw>winW) x=Math.max(2,winW-cw-2)
  if(x<2) x=2; if(y<2) y=2
  ctx.style.left=x+'px'; ctx.style.top=y+'px'
  const first=ctx.querySelector('.ctx-item'); if(first) first.classList.add('kbd') // 键盘可达:首个项先高亮
}
function closeMenu(){
  if(!menuOpen) return
  menuOpen=false
  ctx.classList.add('closing')
  setTimeout(()=>{ ctx.classList.remove('open'); ctx.classList.remove('closing'); ctx.querySelectorAll('.kbd').forEach(e=>e.classList.remove('kbd')) },90)
}
document.addEventListener('contextmenu',e=>{
  e.preventDefault()
  openMenu(e.clientX,e.clientY)
})
document.addEventListener('click',e=>{
  if(menuOpen && !ctx.contains(e.target)) closeMenu()
})
function showToast(msg,dur=1600){
  toast.textContent=msg;toast.style.display='block'
  requestAnimationFrame(()=>toast.classList.add('show'))
  clearTimeout(showToast._t)
  showToast._t=setTimeout(()=>{toast.classList.remove('show');setTimeout(()=>{toast.style.display='none'},240)},dur)
}

ctx.addEventListener('click',e=>{
  // 色块:点了立刻生效,菜单**不关**(方便连着试几个色)
  const sw=e.target.closest?.('.ctx-swatch')
  if(sw){
    e.stopPropagation()
    if(sw.classList.contains('custom')) return // 交给 input 自己的事件
    if(sw.dataset.a==='color-auto'){ pushSetting('color','auto'); showToast('颜色:跟随应用侧') }
    else if(sw.dataset.color){ pushSetting('color', sw.dataset.color); showToast('颜色:'+sw.dataset.color) }
    return
  }
  const item=e.target.closest?.('.ctx-item'); if(!item) return
  const a=item.dataset.a; if(!a) return
  closeMenu()
  handleAction(a)
})
// 系统取色器:拖动过程中连续上报会刷屏,用 change(松开/确认时一次)
const colorInput=document.getElementById('ctx-color-input')
if(colorInput){
  colorInput.addEventListener('change',()=>{
    pushSetting('color', colorInput.value)
    showToast('颜色:'+colorInput.value)
  })
}
/** 设置类动作一律转给**应用侧**(它是真源):窗口不自己存,改完等回推 */
function pushSetting(key,value){ if(api&&api.lyricSetting) api.lyricSetting(key,value) }

function handleAction(a){
  if(!api) return
  if(a==='close') api.lyricClose()
  else if(a==='style-dim'){ pushSetting('lineStyle','dim'); showToast('显示方式:淡色(当前行高亮)') }
  else if(a==='style-app'){ pushSetting('lineStyle','app'); showToast('显示方式:与播放界面一致') }
  else if(a==='font+') pushSetting('fontSize',+1)
  else if(a==='font-') pushSetting('fontSize',-1)
  else if(a==='align') pushSetting('align', appStyle.align==='left'?'center':'left')
  else if(a==='wordMode') pushSetting('wordMode', appStyle.wordMode?'line':'word')
  else if(a==='translation') pushSetting('translation','toggle')
  else if(a==='effect') pushSetting('effect', appStyle.effect?'0':'1')
  else if(a==='title') pushSetting('title', win.showTitle?'0':'1')
  else if(a==='locked'){ win.locked=!win.locked; pushSetting('locked',win.locked?'1':'0'); showToast(win.locked?'已锁定位置(右键可解锁)':'已解锁,可自由移动') }
  else if(a==='pinned'){ win.pinned=!win.pinned; pushSetting('pinned',win.pinned?'1':'0'); showToast(win.pinned?'窗口已置顶':'已取消置顶') }
  else if(a==='bg-dark'){ pushSetting('bg','dark'); showToast('背景:深色底') }
  else if(a==='bg-light'){ pushSetting('bg','light'); showToast('背景:浅色底') }
  else if(a==='bg-none'){ pushSetting('bg','none'); showToast('背景:完全透明') }
  else if(a==='alpha+') pushSetting('alpha',+0.1)
  else if(a==='alpha-') pushSetting('alpha',-0.1)
  else if(a==='through'){
    throughOn=true
    api.lyricClickThrough(true)
    showToast('已开启点击穿透;按 Esc 或从托盘"恢复歌词交互"退出',2600)
  }
  else if(a==='copy'){
    const l=lines[activeIdx]
    if(l&&(l.text||l)){navigator.clipboard.writeText(l.text||l);showToast('已复制当前歌词')}
    else{showToast('暂无当前歌词')}
  }
  else if(a==='copy-all'){
    const allText=lines.map(l=>l.text||l).join('\n')
    if(allText){navigator.clipboard.writeText(allText);showToast('已复制全部歌词 ('+lines.length+'行)')}
    else{showToast('暂无歌词')}
  }
  else if(a==='save'){
    if(lines.length===0){showToast('暂无歌词可保存');return}
    const allText=lines.map(l=>{
      const t=l.time!=null?`[${Math.floor(l.time/60).toString().padStart(2,'0')}:${(l.time%60).toFixed(2).padStart(5,'0')}]`:''
      return t+(l.text||l)
    }).join('\n')
    api.lyricSave(allText)
    showToast('正在保存歌词文件...')
  }
  else if(a==='reset'){
    // 只重置窗口专有项;字号/颜色/逐字/翻译由应用侧统一管理,不在这里动
    pushSetting('bg','dark'); pushSetting('alpha',-Math.max(0,(Number(win.alpha)||0)-0.05))
    if(win.locked) pushSetting('locked','0')
    if(!win.pinned) pushSetting('pinned','1')
    showToast('窗口设置已重置(背景/锁定/置顶)')
  }
}

// ===== 窗口拖动 + 缩放(JS 实现:任意位置按住即拖,>4px 判定为拖动) =====
// 坐标一律用**指针的绝对屏幕坐标**(screenX/screenY),由主进程按"按下时的锚点"换算位置。
// 不能用 movementX/Y:那是 Chromium 按指针屏幕坐标相对上一次事件算的,而拖动时窗口正在光标
// 下面移动 —— 两者互相污染,上报的位移与指针真实走过的距离对不上(越拖越跟不上)。
let dragState = null
let sizeState = null
let suppressClick = false
let _dragRaf = null
let _pendingPointer = null

document.addEventListener('mousedown', e => {
  if (win.locked || menuOpen) return
  if (e.button !== 0) return
  // 只在精确落在缩放柄热区时才进入缩放模式,其余一律视为拖动
  if (e.target.closest?.('#size-handle')) {
    dragState = null // 拖动/缩放互斥:否则拖动的"锁定尺寸"会把缩放结果盖掉
    sizeState = { sx: e.screenX, sy: e.screenY, w: window.innerWidth, h: window.innerHeight }
    return
  }
  sizeState = null
  dragState = { sx: e.screenX, sy: e.screenY, moved: false }
  // 记锚点:主进程据此把"指针位移"映射成"窗口位置",不再读窗口当前位置(没有反馈)
  if (api && api.lyricDragStart) api.lyricDragStart(e.screenX, e.screenY)
})
document.addEventListener('mousemove', e => {
  // 鼠标在**窗口之外**松开时,这里收不到 mouseup —— 状态会一直留着,光标再回到窗口上就继续
  // 拖/继续缩。用户报的"只是移动,歌词区域却同步变大"就是这个:上一次拖角落留下的 sizeState
  // 没被清掉,于是之后每次移动都在按指针坐标改尺寸。用 buttons 判断"按键其实已经松了"。
  if ((e.buttons & 1) === 0) {
    if (dragState || sizeState) {
      if (_pendingPointer && api && api.lyricDragMove) api.lyricDragMove(_pendingPointer.x, _pendingPointer.y)
      dragState = null
      sizeState = null
      _pendingPointer = null
      if (_dragRaf) { cancelAnimationFrame(_dragRaf); _dragRaf = null }
    }
    return
  }
  if (dragState) {
    const dx = e.screenX - dragState.sx, dy = e.screenY - dragState.sy
    if (!dragState.moved && (Math.abs(dx) > 4 || Math.abs(dy) > 4)) {
      dragState.moved = true
      suppressClick = true
    }
    if (dragState.moved && api && api.lyricDragMove) {
      // 合并到每帧一次(mousemove 可达上百赫兹,不必逐条过 IPC);上报绝对坐标
      _pendingPointer = { x: e.screenX, y: e.screenY }
      if (!_dragRaf) {
        _dragRaf = requestAnimationFrame(() => {
          _dragRaf = null
          const p = _pendingPointer
          _pendingPointer = null
          if (p && api && api.lyricDragMove) api.lyricDragMove(p.x, p.y)
        })
      }
    }
  }
  if (sizeState) {
    // 尺寸同样按指针绝对位移算。旧写法把"起始尺寸 + 单帧 movementX"当绝对尺寸用,
    // 每次事件都把尺寸拉回起始值附近 —— 所以缩放几乎不跟手
    if (api && api.lyricResize) {
      api.lyricResize(
        Math.max(220, sizeState.w + (e.screenX - sizeState.sx)),
        Math.max(60, sizeState.h + (e.screenY - sizeState.sy))
      )
    }
  }
})
document.addEventListener('mouseup', () => {
  // 把攒着的那一帧**立刻补发**再清空:快速拖拽时鼠标一松,最后一帧还没发出去就被取消,
  // 位置会停在上一帧(拖到哪儿差一点没跟上)
  if (_pendingPointer && api && api.lyricDragMove) api.lyricDragMove(_pendingPointer.x, _pendingPointer.y)
  if (_dragRaf) { cancelAnimationFrame(_dragRaf); _dragRaf = null }
  _pendingPointer = null
  dragState = null
  sizeState = null
})
// 失焦(切走/窗被隐藏)时也清掉,避免回来还处在拖动/缩放中
window.addEventListener('blur', () => {
  dragState = null
  sizeState = null
  _pendingPointer = null
  if (_dragRaf) { cancelAnimationFrame(_dragRaf); _dragRaf = null }
})

// 拖动/缩放后消费一次 click,避免误触歌词/菜单
document.addEventListener('click', e => {
  if (suppressClick) { e.stopPropagation(); suppressClick = false }
}, true)

// 右下角缩放柄不需要单独监听:上面的 mousedown 已按 closest('#size-handle') 分派到缩放

// ===== 双击歌词行跳转 =====
lyric.addEventListener('dblclick', e => {
  if (suppressClick) { suppressClick = false; return }
  const el=e.target.closest?.('.line')
  if(!el) return
  const idx=parseInt(el.dataset.i)
  if(!isNaN(idx)&&lines[idx]&&lines[idx].time!=null){
    api.lyricSeek(lines[idx].time)
  }
})

// ===== 键盘:Esc 先关菜单、再关窗口;菜单支持上下键与回车 =====
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(menuOpen){ closeMenu(); return }
    if(api) api.lyricClose()
    return
  }
  if(!menuOpen) return
  const items=[...ctx.querySelectorAll('.ctx-item')]
  const cur=items.findIndex(el=>el.classList.contains('kbd'))
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    e.preventDefault()
    const next=e.key==='ArrowDown'?(cur+1)%items.length:(cur-1+items.length)%items.length
    items.forEach(el=>el.classList.remove('kbd'))
    items[next].classList.add('kbd')
  }else if(e.key==='Enter'&&cur>=0){
    e.preventDefault()
    const a=items[cur].dataset.a
    if(a){closeMenu();handleAction(a)}
  }
})

applyBackground()
</script>
</body>
</html>
