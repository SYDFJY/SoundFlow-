<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>SoundFlow 菜单</title>
<!-- 取色板:与岛设置面/播放页同一套 Pickr(打包后就在 dist/vendor 里,dev 由 Vite 从 public 提供)。
     为什么取色必须在这个窗口里开:Chromium 的颜色/文件选择器要**瞬时用户手势**,而手势**不跨窗口** ——
     菜单搬到独立窗口后,再让歌词窗去 input.click() 就静默失效了(用户报"自定义颜色用不了")。 -->
<link rel="stylesheet" href="./vendor/nano.min.css" />
<script src="./vendor/pickr.min.js"></script>
<style>
  /* 共用自绘菜单:与应用一套卡片风格(深色底/描边/圆角/分组标题)。
     窗口由主进程定位在**宿主之外**(不遮主体),这里只负责画与回传点击。 */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: transparent; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
    font-size: 12.5px; color: #dfe5ee; user-select: none;
    -webkit-app-region: no-drag;
  }
  #menu {
    display: inline-block; min-width: 160px; max-width: 340px;
    padding: 5px; border-radius: 10px;
    background: rgba(24, 26, 32, 0.97);
    border: 1px solid rgba(255, 255, 255, 0.10);
    box-shadow: 0 14px 38px rgba(0, 0, 0, 0.55), 0 2px 8px rgba(0, 0, 0, 0.4);
    max-height: 100vh; position: relative;
  }
  /* ⭐ 条目比窗口高时必须能滚:菜单有 20~30 条(≈900px),窗口高度上限由主进程按工作区算,
     放不下就靠这里滚 —— 此前没有任何滚动,底部条目被直接裁掉(用户报"看不到岛设置/不能滑动")。 */
  .m-list {
    max-height: calc(100vh - 12px); /* 12 = 卡片上下内边距 10 + 边框 2 */
    overflow-y: auto; overflow-x: hidden;
    /* 恒定预留滚动条宽度:否则"要不要滚"一变,内容宽度跟着变,卡片宽会来回抖 */
    scrollbar-gutter: stable;
    overscroll-behavior: contain; /* 滚到底不再把滚动链传给别的窗口 */
  }
  .m-list::-webkit-scrollbar { width: 8px; }
  .m-list::-webkit-scrollbar-track { background: transparent; }
  .m-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.16); border-radius: 4px; }
  .m-list::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.28); }
  /* 上下还有内容时的渐隐提示(纯装饰,不吃鼠标) */
  #menu.has-up::before, #menu.has-down::after {
    content: ''; position: absolute; left: 1px; right: 1px; height: 14px;
    pointer-events: none; z-index: 1;
  }
  #menu.has-up::before { top: 1px; border-radius: 9px 9px 0 0; background: linear-gradient(rgba(24,26,32,0.97), rgba(24,26,32,0)); }
  #menu.has-down::after { bottom: 1px; border-radius: 0 0 9px 9px; background: linear-gradient(rgba(24,26,32,0), rgba(24,26,32,0.97)); }
  .m-group {
    font-size: 10px; letter-spacing: 0.08em; color: rgba(255,255,255,0.38);
    padding: 7px 10px 3px;
  }
  .m-item {
    display: flex; align-items: center; gap: 9px;
    padding: 7px 10px; border-radius: 7px; cursor: pointer;
    white-space: nowrap; position: relative;
  }
  .m-item:hover, .m-item.m-active { background: rgba(255,255,255,0.09); color: #fff; }
  .m-item.danger { color: #ff8a8a; }
  .m-item.danger:hover { background: rgba(255,90,90,0.16); }
  .m-ico { width: 15px; height: 15px; flex-shrink: 0; opacity: 0.85; }
  .m-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .m-check { width: 14px; height: 14px; flex-shrink: 0; opacity: 0; color: var(--accent, #4d94ff); }
  .m-item.on .m-check { opacity: 1; }
  .m-sep { height: 1px; margin: 5px 8px; background: rgba(255,255,255,0.08); }
  .m-sub { padding-left: 10px; border-left: 2px solid rgba(255,255,255,0.08); margin-left: 10px; }
  .m-empty { padding: 10px; color: rgba(255,255,255,0.4); }
  /* Pickr 的弹层要压在卡片之上(它自己和卡片一个窗口,不存在被窗口裁的问题) */
  .pcr-app { z-index: 20; }
</style>
</head>
<body>
  <div id="menu"><div class="m-list" id="list"></div></div>
  <!-- 兜底取色入口(Pickr 没加载出来时才用):放在**本窗**里,手势在自己身上,系统取色器能开 -->
  <input type="color" id="native-color" style="position:fixed;left:-9999px;top:-9999px;width:1px;height:1px" aria-hidden="true" />
<script>
const api = window.electronAPI
const root = document.getElementById('menu')
const listEl = document.getElementById('list')
let accent = '#4d94ff'

// 极简内联图标集(不引外部依赖:这个窗口独立于 Vite 构建,只有 preload 可用)
const ICONS = {
  play: '<path d="M8 5v14l11-7z"/>',
  pause: '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>',
  prev: '<path d="M6 5h2v14H6zm12 0v14l-9-7z"/>',
  next: '<path d="M16 5h2v14h-2zM6 5l9 7-9 7z"/>',
  back: '<path d="M11 18V6l-8.5 6zM13 6h2v12h-2z"/>',
  forward: '<path d="M13 18V6l8.5 6zM11 6H9v12h2z"/>',
  mode: '<path d="M17 2l4 4-4 4V7h-4V5h4zM3 6h6v2H3zm0 6h10v2H3zm0 6h10v2H3z"/>',
  volume: '<path d="M4 9h3l4-4v14l-4-4H4zM15 8.5a4 4 0 010 7"/>',
  speed: '<path d="M12 4a8 8 0 018 8h-2a6 6 0 10-6 6v2a8 8 0 010-16zm1 3v5l4 2-.8 1.6L12 13V7z"/>',
  bg: '<circle cx="12" cy="12" r="9"/><path d="M12 3v18"/>',
  alpha: '<circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 000 18z" fill="currentColor"/>',
  text: '<path d="M5 5h14v3h-5v11h-4V8H5z"/>',
  lyric: '<path d="M4 6h16v2H4zm0 5h10v2H4zm0 5h16v2H4z"/>',
  window: '<rect x="4" y="5" width="16" height="14" rx="2"/>',
  pin: '<path d="M12 17v5"/><path d="M9 10.8V4h6v6.8l2 2.6v1.6H7v-1.6z"/>',
  expand: '<path d="M4 9h16v2H4z"/>',
  collapse: '<path d="M4 9h16v2H4z" transform="rotate(180 12 10)"/>',
  form: '<rect x="4" y="5" width="16" height="7" rx="3.5"/><rect x="4" y="14" width="16" height="5" rx="2.5"/>',
  exit: '<path d="M10 4H6v16h4v-2H8V6h2zM14 8l4 4-4 4v-3H11v-2h3z"/>',
  settings: '<path d="M4 7h16v2H4zm0 8h16v2H4z"/><circle cx="9" cy="8" r="2" fill="currentColor"/><circle cx="15" cy="16" r="2" fill="currentColor"/>',
  restore: '<path d="M4 4h16v12H4z"/><path d="M8 20h8v-2H8z"/>',
  effect: '<path d="m12 3-1.9 5.8L4 10.7l5.8 1.9L12 18.4l1.9-5.8L20 10.7l-5.8-1.9z"/>',
  palette: '<circle cx="12" cy="12" r="9"/><circle cx="9" cy="10" r="1.4" fill="currentColor"/><circle cx="15" cy="10" r="1.4" fill="currentColor"/><circle cx="12" cy="15" r="1.4" fill="currentColor"/>',
  lock: '<rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 018 0v3"/>',
  through: '<path d="m3 3 7.07 16.97 2.51-7.39 7.39-2.51z"/>',
  copy: '<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M4 16V6a2 2 0 012-2h10"/>',
  save: '<path d="M15 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V7z"/><path d="M14 2v5h5"/>',
  close: '<path d="M18 6L6 18M6 6l12 12"/>',
  check: '<path d="M20 6L9 17l-5-5"/>'
}
function icon(name) {
  if (!name || !ICONS[name]) return ''
  return `<svg class="m-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]}</svg>`
}

function render(items) {
  const rows = []
  for (const it of items || []) {
    if (!it) continue
    if (it.type === 'separator') { rows.push('<div class="m-sep"></div>'); continue }
    if (it.type === 'groupTitle') { rows.push(`<div class="m-group">${esc(it.label)}</div>`); continue }
    const cls = ['m-item']
    if (it.checked) cls.push('on')
    if (it.danger) cls.push('danger')
    // it.color 是**取色条目**:在这一项上就地开取色板(值随条目一起从主进程带过来)
    rows.push(`<div class="${cls.join(' ')}" data-id="${esc(it.id || '')}"${typeof it.color === 'string' ? ` data-color="${esc(it.color)}"` : ''} role="menuitem"${it.checked ? ' aria-checked="true"' : ''}>
      ${icon(it.icon)}<span class="m-label">${esc(it.label)}</span>
      <svg class="m-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">${ICONS.check}</svg>
    </div>`)
  }
  closeColorPicker()
  listEl.innerHTML = rows.join('') || '<div class="m-empty">(无可用项)</div>'
  listEl.scrollTop = 0
  setActive(-1, false) // 先不预高亮:键盘没用过就只显示悬停那套,免得两套高亮同时亮
  updateScrollHint()
  reportSize()
}
// 键盘导航(页内那份菜单曾有、迁到共用窗口后丢过):↑/↓ 移高亮、回车触发、Esc 关闭
function menuItems() { return [...listEl.querySelectorAll('.m-item')] }
function setActive(idx, scroll = true) {
  const items = menuItems()
  if (!items.length) return
  const i = Math.max(-1, Math.min(items.length - 1, idx)) // -1 = 没有高亮(键盘还没用过)
  items.forEach((el, n) => el.classList.toggle('m-active', n === i))
  if (i >= 0 && scroll) { try { items[i].scrollIntoView({ block: 'nearest' }) } catch (e) {} }
  updateScrollHint()
}
function activeIndex() { return menuItems().findIndex((el) => el.classList.contains('m-active')) }
// 上下还有内容时给卡片加渐隐提示(不然用户根本不知道能滚)
function updateScrollHint() {
  const canUp = listEl.scrollTop > 1
  const canDown = listEl.scrollTop + listEl.clientHeight < listEl.scrollHeight - 1
  root.classList.toggle('has-up', canUp)
  root.classList.toggle('has-down', canDown)
}
function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;')
}
// 把**内容**尺寸报给主进程:由它把窗口放到**宿主之外**再显示(避免先亮后跳),并按工作区钳上限。
// 注意:高度必须量内容(`scrollHeight`)而不是卡片矩形:卡片被 max-height:100vh 压住时,
//    矩形量到的是**当前窗口高** —— 主进程据此设窗,永远停在"刚才那个高度"(窗口再也长不大)。
function reportSize() {
  const r = root.getBoundingClientRect()
  const contentH = listEl.scrollHeight
  const h = Math.max(contentH + 12, 60) // 卡片内边距 10 + 边框 2
  try { api.send('menu:size', { width: Math.ceil(r.width) + 2, height: Math.ceil(h) + 2 }) } catch (e) {}
}

const fire = (row) => {
  const id = row && row.getAttribute('data-id')
  if (id) { try { api.send('menu:click', { id }) } catch (err) {} }
}

// ===== 取色条目:在本窗就地开取色板(手势必须发生在同一个窗口里,见文件头注释) =====
let pickr = null
let pickRow = null
let lastPickAt = 0
let pickTimer = null
function closeColorPicker() {
  if (pickr) { try { pickr.hide() } catch (e) {} }
  pickRow = null
  if (pickTimer) { clearTimeout(pickTimer); pickTimer = null }
}
// 边调边看:拖动时 change 很密,合并成 ~80ms 一次(每次都要落盘,别拖一下就写几十遍)
function sendPick(id, value, immediate) {
  const send = () => { lastPickAt = Date.now(); try { api.send('menu:pick', { id, value }) } catch (e) {} }
  const wait = Date.now() - lastPickAt
  if (immediate || wait >= 80) { if (pickTimer) { clearTimeout(pickTimer); pickTimer = null } send(); return }
  if (!pickTimer) pickTimer = setTimeout(() => { pickTimer = null; send() }, 80 - wait)
}
function openColorPicker(row) {
  const id = row.getAttribute('data-id')
  const cur = row.getAttribute('data-color') || '#ffffff'
  closeColorPicker()
  if (window.Pickr) {
    try {
      pickr = window.Pickr.create({
        el: row, theme: 'nano', default: cur,
        components: { preview: true, opacity: false, hue: true, interaction: { hex: true, input: true, save: true } }
      })
      pickr.on('change', (c) => { if (c) sendPick(id, c.toHEXA().toString(), false) })
      pickr.on('save', (c) => {
        const hex = c ? c.toHEXA().toString() : cur
        sendPick(id, hex, true)
        try { api.send('menu:click', { id, value: hex }) } catch (e) {}
      })
      pickr.show()
      pickRow = row
      return
    } catch (e) { pickr = null }
  }
  // 兜底:Pickr 没加载出来 → 用本窗的隐藏系统取色器(手势在自己身上,能开)
  const inp = document.getElementById('native-color')
  if (!inp) return
  inp.value = /^#[0-9a-f]{6}$/i.test(cur) ? cur : '#ffffff'
  inp.onchange = () => {
    try { api.send('menu:pick', { id, value: inp.value }) } catch (e) {}
    try { api.send('menu:click', { id, value: inp.value }) } catch (e) {}
  }
  inp.click()
}
root.addEventListener('click', (e) => {
  // 取色板自己那块区域里的点击不算"点了菜单条目"
  if (e.target.closest && e.target.closest('.pcr-app')) return
  const row = e.target.closest && e.target.closest('.m-item')
  if (!row) return
  if (row.hasAttribute('data-color')) { openColorPicker(row); return }
  fire(row)
})
listEl.addEventListener('scroll', updateScrollHint, { passive: true })
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    // 取色板开着就先收取色板(第二下才收菜单)
    if (pickRow) { closeColorPicker(); return }
    try { api.send('menu:close') } catch (err) {}
    return
  }
  if (pickRow && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) return // 别把焦点从取色板上抢走
  if (e.key === 'ArrowDown') { e.preventDefault(); const a = activeIndex(); setActive(a < 0 ? 0 : a + 1); return }
  if (e.key === 'ArrowUp') { e.preventDefault(); const a = activeIndex(); setActive(a < 0 ? menuItems().length - 1 : a - 1); return }
  if (e.key === 'Home') { e.preventDefault(); setActive(0); return }
  if (e.key === 'End') { e.preventDefault(); setActive(menuItems().length - 1); return }
  if (e.key === 'Enter' || e.key === ' ') {
    const items = menuItems()
    const cur = items[activeIndex()]
    if (cur) { e.preventDefault(); fire(cur) }
  }
})
api.on('menu:items', (payload) => {
  if (payload && typeof payload.accent === 'string') {
    accent = payload.accent
    document.documentElement.style.setProperty('--accent', accent)
  }
  render(payload && payload.items)
})
// 字体就绪后尺寸会变,复报一次
try { if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { updateScrollHint(); reportSize() }).catch(() => {}) } catch (e) {}
window.addEventListener('resize', () => { updateScrollHint(); reportSize() })
</script>
</body>
</html>
